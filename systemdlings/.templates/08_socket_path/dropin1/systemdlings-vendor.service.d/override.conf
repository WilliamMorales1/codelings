# dropin1: drop-ins, and resetting list settings
#
# Never edit a packaged unit in /usr/lib/systemd: the next update overwrites
# it. Put changes in a drop-in instead, a directory next to (or shadowing)
# the unit:
#   foo.service.d/*.conf
# `systemctl edit foo.service` creates one for you; `systemctl cat` shows
# the unit with all its drop-ins merged.
#
# A drop-in only needs the keys it changes. But some keys are *lists*:
# ExecStart=, Environment=, After=, ... A second ExecStart= line adds a
# command instead of replacing it - and a non-oneshot service with two
# ExecStart= commands does not load. An empty assignment, `ExecStart=`,
# clears the list first.
#
# Task: make the vendor daemon listen on port 9090 through this drop-in,
# without touching systemdlings-vendor.service.

[Service]
ExecStart=/usr/bin/sh -c 'echo "listening on port 9090"; exec sleep infinity'
