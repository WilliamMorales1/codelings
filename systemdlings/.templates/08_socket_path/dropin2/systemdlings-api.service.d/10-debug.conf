# dropin2: drop-in order
#
# All *.conf files in foo.service.d/ (from every unit directory, merged by
# file name) are applied in lexical order of their names. For a plain
# setting the last one wins; for Environment= the last assignment of a
# variable wins. That is why packages use numbered names like
# 50-defaults.conf, and your own overrides want a higher number.
#
# Task: this drop-in is meant to switch the api to debug logging, but it
# loses to 50-defaults.conf. Make it win without editing 50-defaults.conf
# (hint: this file's name matters, not only its content).
# `systemctl --user cat systemdlings-api.service` lists the files in the
# order they apply.

[Service]
Environment=LOG_LEVEL=debug
