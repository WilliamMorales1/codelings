# eviction1 — maxmemory and eviction policies
#
# Learn: maxmemory caps the dataset. What happens at the cap is the
# maxmemory-policy:
#   noeviction      writes fail with "OOM command not allowed" (default)
#   allkeys-lru     evict the least recently used key, any key
#   allkeys-lfu     evict the least frequently used key, any key
#   volatile-lru    evict LRU keys, but ONLY among keys that have a TTL
#   volatile-ttl    evict the keys closest to expiring
#   allkeys-random / volatile-random
# The volatile-* policies act like noeviction when no key has a TTL.
#
# Task: this server is a pure cache (the app never sets TTLs) limited to
# 4 MB. When it's full, it must drop the least recently used keys instead
# of refusing writes. The check starts the server with this file and
# writes about 7 MB.
#

maxmemory 4mb
# evict LRU keys when full
maxmemory-policy volatile-lru
