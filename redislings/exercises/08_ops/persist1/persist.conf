# persist1 — RDB snapshots and the append-only file
#
# Learn: Redis keeps data in memory; persistence is opt-in.
#   RDB ("save <seconds> <changes>"): a compact snapshot now and then.
#       Everything since the last snapshot is lost in a crash.
#   AOF ("appendonly yes"): every write is appended to a log, replayed at
#       startup. appendfsync decides how often it hits the disk:
#       always (slow, safe), everysec (lose at most ~1s), no (the OS
#       decides, often ~30s).
# They can be combined; save "" disables snapshots.
#
# Task: this is a job queue: after a crash (kill -9, power loss) it may
# lose at most about one second of writes. The check writes, waits 1.5s,
# kills the server with SIGKILL and restarts it from the same directory.
#

save ""
appendonly no
appendfsync no
