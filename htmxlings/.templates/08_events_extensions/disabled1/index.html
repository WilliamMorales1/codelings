<!doctype html>
<!--
  disabled1 - hx-disabled-elt

  Double-clicking "Place order" places two orders. hx-disabled-elt adds
  the disabled attribute to elements for the duration of a request:
    hx-disabled-elt="this"            the requesting element
    hx-disabled-elt="find button"     a descendant
    hx-disabled-elt="#a, #b"          any selector

  TASK: disable the form's submit button while the order is posting.

  Try it in a browser: npm run serve disabled1
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>disabled1</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/htmx.js"></script>
</head>
<body>
  <h1>Checkout</h1>
  <form hx-post="/order" hx-target="#out">
    <input name="item" value="keyboard">
    <button>Place order</button>
  </form>
  <div id="out"></div>
</body>
</html>
