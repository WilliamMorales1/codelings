# dns5: who wins, /etc/hosts or DNS?
#
# /etc/nsswitch.conf tells the C library where to look things up, in order.
# The `hosts:` line matters for names: `files` = /etc/hosts, `dns` =
# the servers from resolv.conf, and on many desktops also `resolve`
# (systemd-resolved), `mymachines`, `myhostname`, `mdns`...
#
# A developer pinned api.lab.test to a staging box in /etc/hosts:
#     10.99.0.81   api.lab.test
# but programs still reach production (10.53.0.81, from DNS). The check
# installs this file as /etc/nsswitch.conf, adds that /etc/hosts line, and
# expects:
#     getent hosts api.lab.test  -> 10.99.0.81   (the override)
#     getent hosts web.lab.test  -> 10.53.0.80   (DNS still works)
#
# Your task: fix the lookup order. Leave the other lines alone.

passwd: files
group: files
shadow: files
hosts: dns files
