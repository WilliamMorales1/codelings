# dns2: /etc/resolv.conf, where is my DNS server?
#
# When /etc/hosts has no answer, the C library's resolver asks the DNS
# servers listed in /etc/resolv.conf (`nameserver ADDRESS`, up to three,
# tried in order). If none is listed, it tries 127.0.0.1.
#
# The check copies this file to /etc/resolv.conf in the sandbox. A DNS server
# for the zone lab.test runs in namespace dns at 10.53.0.53, port 53. Then:
#     getent hosts web.lab.test  -> 10.53.0.80
#
# Your task: point the resolver at that server. The line below looks
# plausible, and the resolver silently ignores it. There is no port syntax in
# resolv.conf: DNS is always port 53.

nameserver 10.53.0.53:53
