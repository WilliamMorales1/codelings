# dns3: search domains
#
# `search DOMAIN...` lets you type short names: the resolver tries NAME.DOMAIN
# for each domain in turn. That is why `ssh build01` works at the office.
#
# The check installs this as /etc/resolv.conf (the DNS server at 10.53.0.53
# knows both lab.test and corp.test), then:
#     getent hosts web       -> 10.53.0.80   (web.lab.test)
#     getent hosts intranet  -> 10.54.0.10   (intranet.corp.test)
#
# Your task: make both short names work. Right now only one does. resolv.conf
# has a few "last one wins" rules, and this file trips over one of them.

nameserver 10.53.0.53
search lab.test
search corp.test
