<!doctype html>
<!--
  position1: relative, absolute, sticky, z-index

  An absolute element is placed against its nearest positioned ancestor,
  so the parent usually needs `relative`. top-0 / right-2 / inset-0 place
  it; z-10 lifts it above later siblings. `sticky top-0` keeps a header
  stuck to the top of the scrolling area.

  Task:
    - the header sticks to the top of the viewport and stays above the
      content (z-10), with a white background
    - the "Sale" badge sits in the top-right corner of its product card,
      0.5rem from each edge (the card must be its containing block)

  Preview: npm run preview position1
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>position1</title>
  </head>
  <body>
    <header id="header" class="fixed bg-white p-4 shadow-sm">Shop</header>
    <main class="p-4">
      <div id="card" class="h-64 w-48 rounded-lg bg-gray-100">
        <span id="badge" class="absolute rounded bg-red-600 px-2 text-sm text-white">Sale</span>
      </div>
      <div class="h-[200vh]"></div>
    </main>
  </body>
</html>
