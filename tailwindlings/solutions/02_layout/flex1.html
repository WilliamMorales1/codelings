<!doctype html>
<!--
  flex1: a navbar with flexbox

  `flex` makes a flex container. Along the main axis (a row by default)
  justify-* distributes items: justify-start, justify-center,
  justify-between. Across it, items-* aligns them: items-center, items-end.
  gap-6 puts 1.5rem between items without margins on the children.

  Task: the logo on the far left, the links on the far right, both
  vertically centred in the bar; the links in a row, 1.5rem apart.

  Preview: npm run preview flex1
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>flex1</title>
  </head>
  <body>
    <nav id="bar" class="flex h-16 items-center justify-between bg-slate-900 px-6 text-white">
      <a href="#" class="text-2xl font-bold">acme</a>
      <ul id="links" class="flex gap-6">
        <li><a href="#">Pricing</a></li>
        <li><a href="#">Docs</a></li>
        <li><a href="#">Sign in</a></li>
      </ul>
    </nav>
  </body>
</html>
