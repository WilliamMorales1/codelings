<!doctype html>
<!--
  grid1: CSS grid columns and spans

  grid + grid-cols-3 makes three equal columns
  (grid-template-columns: repeat(3, minmax(0, 1fr))). gap-4 spaces rows and
  columns. A child with col-span-2 covers two columns.

  Task: lay the six stat cards out in a 3-column grid with 1rem gaps, and
  make the first card ("Revenue") twice as wide as the others.

  Preview: npm run preview grid1
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>grid1</title>
  </head>
  <body class="p-8">
    <section id="stats" class="grid grid-cols-3 gap-4">
      <div id="revenue" class="col-span-2 rounded-lg bg-sky-100 p-4">Revenue</div>
      <div class="rounded-lg bg-gray-100 p-4">Users</div>
      <div class="rounded-lg bg-gray-100 p-4">Churn</div>
      <div class="rounded-lg bg-gray-100 p-4">MRR</div>
      <div class="rounded-lg bg-gray-100 p-4">NPS</div>
    </section>
  </body>
</html>
