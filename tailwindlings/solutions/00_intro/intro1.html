<!doctype html>
<!--
  intro1: the ritual

  Welcome to tailwindlings. Every exercise is an HTML file (sometimes with a
  style.css next to it). The tests compile it with Tailwind CSS v4, exactly as
  the CLI would, then check the styles the elements actually end up with.

  The <h1> below should use three utilities:
    text-3xl     font-size from the theme's --text-3xl
    font-bold    font-weight: 700
    text-sky-700 color from --color-sky-700

  Task: one of them is missing. Add it and save. Once the tests pass, the
  exercise is done and the runner moves you on.

  See it in a browser:  npm run preview intro1
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>intro1</title>
  </head>
  <body class="p-8">
    <h1 id="title" class="text-3xl font-bold text-sky-700">Hello, Tailwind</h1>
  </body>
</html>
