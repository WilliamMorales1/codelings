syntax = "proto3";

package logs.v1;

option go_package = "grpclings/exercises/06_streaming/streams1;streams1";

message LogLine {
  string level = 1;
  string text = 2;
}

message TailRequest {
  // Only lines of this level; empty means all.
  string level = 1;
}

service LogService {
  // The server sends any number of LogLines, then ends the stream.
  rpc Tail(TailRequest) returns (stream LogLine);
}
