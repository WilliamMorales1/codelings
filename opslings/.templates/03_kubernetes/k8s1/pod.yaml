# k8s1 -- anatomy of a Pod
#
# Every Kubernetes object has the same four top-level keys:
#   apiVersion   which API group/version defines the kind
#   kind         what it is
#   metadata     name, namespace, labels, annotations
#   spec         what you want
#
# The API server rejects unknown fields, and so does `kubeconform -strict`,
# which validates manifests against the official OpenAPI schemas without
# needing a cluster:
#
#   kubeconform -strict -summary pod.yaml
#   kubectl explain pod.spec.containers.ports     # if you have kubectl
#
# Task: make this a valid Pod named `web` running nginx:1.27-alpine that
# declares container port 80.
#

apiVersion: apps/v1
kind: Pod
metadata:
  name: web
  labels:
    app: web
spec:
  containers:
    - name: web
      image: nginx:1.27-alpine
      port: 80
