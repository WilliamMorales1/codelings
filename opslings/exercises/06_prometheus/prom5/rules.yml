# prom5 -- noticing that something is gone
#
# Every scrape writes a synthetic series  up{job, instance}: 1 if the scrape
# worked, 0 if it failed. `up == 0` catches targets that are down.
#
# But if a target vanishes from service discovery altogether, there is no
# `up` series left to be 0 -- the alert just quietly stops matching. absent()
# covers that: absent(v) returns 1 (with the labels from v's equality
# matchers) when v has no series at all, and nothing otherwise.
#
# Task:
#   InstanceDown   any target down for 1m;  severity: warning
#                  annotation  summary: "{{ $labels.instance }} of {{ $labels.job }} is down"
#   ApiMissing     no `up` series for job="api" at all, for 5m;  severity: page
#                  annotation  summary: "No api targets are being scraped"
#
#   promtool check rules rules.yml
#

groups:
  - name: availability
    rules:
      - alert: InstanceDown
        expr: up = 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} of {{ $labels.job }} is down"

      - alert: ApiMissing
        expr: absent(up{job="api"}) == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "No api targets are being scraped"
