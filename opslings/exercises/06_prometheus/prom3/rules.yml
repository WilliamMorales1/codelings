# prom3 -- alerting on an error ratio
#
# Alert on symptoms users feel, as a ratio, not raw counts: "5% of requests
# fail" means the same thing at 10 req/s and at 10 000 req/s.
#
#   for:          how long the condition must hold before the alert fires
#                 (pending until then) -- this filters out blips
#   labels:       added to the alert; Alertmanager routes on them
#   annotations:  human text; templates like {{ $labels.job }} and
#                 {{ $value }} are expanded
#
# Label matchers: `=` is exact, `=~` is a regex, so status codes 500-599
# are  code=~"5.."
#
# Task: alert `HighErrorRate` when, per job, more than 5% of
# http_requests_total over 5 minutes have a 5xx code, sustained for 10m,
# with label  severity: page  and exactly one annotation:
#   summary: "High error rate on {{ $labels.job }}"
#
#   promtool check rules rules.yml
#

groups:
  - name: slo
    rules:
      - alert: HighErrorRate
        expr: |
          sum by (job) (rate(http_requests_total{code="5xx"}[5m]))
            /
          sum by (job) (rate(http_requests_total[5m]))
            > 0.05
        labels:
          severity: critical
        annotations:
          summary: "High error rate on {{ $labels.job }}"
