# k8s8 -- RBAC
#
# RBAC is four objects working together:
#   ServiceAccount  an identity for workloads (here: the CI deploy job)
#   Role            a list of allowed verbs on resources, in one namespace
#   RoleBinding     "this subject gets that Role", in the same namespace
#   (ClusterRole / ClusterRoleBinding are the cluster-wide versions)
#
# Resources belong to API groups: Pods are in the core group, written "",
# Deployments are in "apps". A rule with the wrong group silently grants
# nothing.
#
# Task: in namespace `ci`, the ServiceAccount `deployer` may
#   - get, list, watch pods
#   - get, list, patch, update deployments
# and nothing more. Fix the manifests below so that is exactly what happens.
#
#   kubeconform -strict -summary rbac.yaml
#   kubectl auth can-i patch deployments --as=system:serviceaccount:ci:deployer -n ci
#                                                   # (on a live cluster)
#

apiVersion: v1
kind: Namespace
metadata:
  name: ci
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: ci
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: ci
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
