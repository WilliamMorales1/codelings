# k8s6 -- Secrets as files
#
# Secret values under `data:` must be base64-encoded; `stringData:` takes
# plain text and the API server encodes it for you. (base64 is an encoding,
# not encryption -- lock Secrets down with RBAC.)
#
# Mounting a Secret as a volume puts one file per key into a directory,
# and updates to the Secret eventually show up in the files. Mount it
# readOnly: nothing in the app should be writing credentials.
#
# Task:
#   - fix the Secret `db-creds` so its values are valid
#   - mount it into the `api` Pod at /etc/db, readOnly
#   - the volume must reference the Secret by its real name
#
#   kubeconform -strict -summary secret.yaml
#   echo -n hunter2 | base64
#

apiVersion: v1
kind: Secret
metadata:
  name: db-creds
type: Opaque
stringData:
  username: app
  password: hunter2
---
apiVersion: v1
kind: Pod
metadata:
  name: api
spec:
  containers:
    - name: api
      image: ghcr.io/acme/api:1.4.2
      volumeMounts:
        - name: creds
          mountPath: /etc/db
          readOnly: true
  volumes:
    - name: creds
      secret:
        secretName: db-creds
