# prom1 -- scrape configuration
#
# Prometheus pulls: every scrape_interval it fetches /metrics from each
# target. prometheus.yml lists *jobs*, each with its targets; every scraped
# series gets `job` and `instance` labels from them.
#
# Durations always carry a unit (15s, 1m). `promtool check config` validates
# the file without starting anything:
#
#   promtool check config prometheus.yml
#
# Task:
#   - scrape every 15s and evaluate rules every 30s by default
#   - job `node`: the node exporters on localhost:9100 and 10.0.0.2:9100
#   - job `api`: api.internal:8080, which serves its metrics on
#     /internal/metrics (not the default /metrics) and must be scraped
#     every 5s
#

global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["localhost:9100", "10.0.0.2:9100"]

  - job_name: api
    metrics_path: /internal/metrics
    scrape_interval: 5s
    static_configs:
      - targets: ["api.internal:8080"]
