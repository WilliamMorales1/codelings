apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: billing
          image: registry.example.com/billing:2.0.0
          ports:
            - containerPort: 8080
        - name: log-shipper
          image: fluent/fluent-bit:3.1
